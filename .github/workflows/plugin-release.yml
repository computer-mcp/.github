name: Plugin release
on:
  workflow_call:
    inputs:
      ref:
        description: Signed annotated version tag, or a commit for a dry run
        type: string
        required: true
      publish:
        description: Publish the verified release (false assembles a dry-run bundle)
        type: boolean
        default: false
      build:
        description: Build command; the workflow appends the output directory as its final argument
        type: string
        required: true
      ci_artifact:
        description: Exact ci.yml artifact name; ${commit} expands to the resolved commit
        type: string
        required: true
      runner:
        description: Runner for verification and rebuilding
        type: string
        default: ubuntu-24.04
    outputs:
      published:
        description: True only when a complete immutable release is public
        value: ${{ jobs.publish.outputs.published || 'false' }}
      release_id:
        description: Published GitHub Release ID (empty for a dry run)
        value: ${{ jobs.publish.outputs.release_id }}
      tag:
        description: Verified version tag (empty for an untagged dry run)
        value: ${{ jobs.verify.outputs.tag }}
permissions: {}
concurrency:
  group: plugin-release-${{ github.repository }}-${{ inputs.ref }}
  cancel-in-progress: false
env:
  PLUGIN_RELEASE_SHA256: '7db2ecf02b97c6d16654db5cf0f34e43640005c1ececbbba84c0baa68c2179d8'
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.bundle.outputs.tag }}
      receipt_sha256: ${{ steps.bundle.outputs.receipt_sha256 }}
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Load the helper from this reusable workflow's immutable revision
        id: helper
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          from urllib.request import Request, urlopen

          def get(path):
              request = Request('https://api.github.com' + path, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(request, timeout=60) as response:
                  return json.load(response)

          run = get('/repos/' + os.environ['GH_REPOSITORY'] + '/actions/runs/' + os.environ['GH_RUN_ID'])
          prefix = 'computer-mcp/.github/.github/workflows/plugin-release.yml@'
          references = {(item['path'], item['sha']) for item in run['referenced_workflows']
                        if item['path'].startswith(prefix)}
          if len(references) != 1:
              raise SystemExit('Expected exactly one immutable plugin-release workflow reference')
          reference, revision = references.pop()
          if not re.fullmatch('[0-9a-f]{40}', revision) or reference != prefix + revision:
              raise SystemExit('Pin the reusable release workflow by its full commit SHA')
          source = get('/repos/computer-mcp/.github/contents/Scripts/plugin_release.py?ref=' + revision)
          data = base64.b64decode(source['content'])
          if hashlib.sha256(data).hexdigest() != os.environ['PLUGIN_RELEASE_SHA256']:
              raise SystemExit('Release helper differs from this workflow pin')
          root = Path(os.environ['RUNNER_TEMP']) / 'plugin-release'
          root.mkdir()
          (root / 'plugin_release.py').write_bytes(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('workflow_ref=' + reference + '\nworkflow_sha=' + revision + '\n')
          PY
      - name: Resolve and verify the source ref
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          python3 -I "$RUNNER_TEMP/plugin-release/plugin_release.py" resolve \
            --repository "$GH_REPOSITORY" --ref "$RELEASE_REF" --publish "$RELEASE_PUBLISH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: plugin
          persist-credentials: false
      - name: Rebuild, compare and assemble the release bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          RELEASE_BUILD: ${{ inputs.build }}
          RELEASE_CI_ARTIFACT: ${{ inputs.ci_artifact }}
          RELEASE_WORKFLOW_REF: ${{ steps.helper.outputs.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ steps.helper.outputs.workflow_sha }}
        shell: bash
        run: |
          python3 -I "$RUNNER_TEMP/plugin-release/plugin_release.py" verify \
            --repository "$GH_REPOSITORY" --ref "$RELEASE_REF" --publish "$RELEASE_PUBLISH" \
            --checkout "$GITHUB_WORKSPACE/plugin" --build "$RELEASE_BUILD" \
            --ci-artifact "$RELEASE_CI_ARTIFACT" \
            --workflow-ref "$RELEASE_WORKFLOW_REF" --workflow-sha "$RELEASE_WORKFLOW_SHA" \
            --output "$RUNNER_TEMP/plugin-release/assets" --build-output "$RUNNER_TEMP/plugin-release-build"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-release/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outputs.published }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/plugin-release
      - name: Verify the helper and publish only the verified bundle
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_RECEIPT_SHA256: ${{ needs.verify.outputs.receipt_sha256 }}
        shell: bash
        run: |
          python3 -I - <<'PY'
          import hashlib, os, subprocess, sys
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'plugin-release'
          helper = root / 'plugin_release.py'
          if helper.is_symlink() or hashlib.sha256(helper.read_bytes()).hexdigest() != os.environ['PLUGIN_RELEASE_SHA256']:
              raise SystemExit('Release helper differs from this workflow pin')
          subprocess.run([sys.executable, '-I', str(helper), 'publish',
                          '--repository', os.environ['GH_REPOSITORY'],
                          '--directory', str(root / 'assets'),
                          '--receipt-sha256', os.environ['RELEASE_RECEIPT_SHA256']], check=True)
          PY
