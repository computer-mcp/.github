name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint DESIGN.md
        uses: showxu/skills/skills/github-readme-design/scripts@fc3529f199d43d1df6968bfc682220d3e75a2c4b
        with:
          asset: design
          command: lint
          design: DESIGN.md
      - name: Check the organization profile
        uses: showxu/skills/skills/github-readme-design/scripts@fc3529f199d43d1df6968bfc682220d3e75a2c4b
        with:
          asset: profile
          design: DESIGN.md
          catalog: profile/catalog.json
      - name: Check this repository's social preview
        uses: showxu/skills/skills/github-readme-design/scripts@fc3529f199d43d1df6968bfc682220d3e75a2c4b
        with:
          asset: social-preview
          design: DESIGN.md
          fonts: .github/design/fonts
          catalog: profile/catalog.json
          repository: .github
          icon: profile/assets/mark-light.png
          assets: .github/assets/social-preview
  organization:
    permissions:
      contents: read
    uses: computer-mcp/github-workflows/.github/workflows/organization.yml@fd25fcface41732fda099017c6945912366fc7c1
    with:
      # The catalog under review must match the live inventory and About sentences.
      declaration-revision: ${{ github.event.pull_request.head.sha || github.sha }}
      scope: membership
