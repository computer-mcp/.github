name: Source policy checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    uses: computer-mcp/github-workflows/.github/workflows/policy.yml@4359ca27a4637460ba8d3f6461e42701f76f647a
    with:
      # A pull request is checked against the accepted rules, not the rules it proposes.
      declaration-revision: ${{ github.event.pull_request.base.sha || github.sha }}
