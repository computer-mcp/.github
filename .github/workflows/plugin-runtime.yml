name: Plugin runtime
on:
  workflow_call:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify shared Python runtime
        env:
          PLUGIN_RUNTIME_SHA256: '5a9f797bfca4b6ab31a9a648017fb1d09400593a9aab0d2250d426efa51f97cf'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys

          root = Path.cwd().resolve()
          path = (root / "bin/plugin_runtime.py").resolve()
          if not path.is_relative_to(root) or not path.is_file():
              sys.exit("Missing plugin runtime: bin/plugin_runtime.py")
          if hashlib.sha256(path.read_bytes()).hexdigest() != os.environ["PLUGIN_RUNTIME_SHA256"]:
              sys.exit("Plugin runtime differs from the pinned shared runtime: bin/plugin_runtime.py")
          print("Plugin runtime matches the pinned shared runtime")
          PY
